<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="display:none">
  <!-- Decorative animated background patterns -->
  <defs>
    <pattern id="grid-pattern" x="20" y="20" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(86,214,255,0.1)"/>
    </pattern>
  </defs>

  <!-- Floating particles -->
  <symbol id="particle-small" viewBox="0 0 10 10">
    <circle cx="5" cy="5" r="2" fill="rgba(86,214,255,0.6)"/>
  </symbol>

  <!-- Decorative shapes -->
  <symbol id="shape-blob" viewBox="0 0 100 100">
    <path d="M 50 10 Q 90 30 85 50 Q 95 70 50 90 Q 10 75 15 50 Q 5 30 50 10" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
  </symbol>

  <symbol id="shape-circle" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
  </symbol>

  <symbol id="shape-line" viewBox="0 0 100 10">
    <line x1="0" y1="5" x2="100" y2="5" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  </symbol>
</svg>
